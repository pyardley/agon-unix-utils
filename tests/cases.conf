# Test cases for agon-unix-utils
# Format (whitespace-separated):
#   NAME | COMMAND | OUTFILE | EXPECTED | MODE
# MODE:
#   file   — OUTFILE must match tests/expected/EXPECTED
#   empty  — OUTFILE must be empty / missing / only whitespace
#   exists — path EXISTS (relative to SD root) must exist after command
#   regex  — OUTFILE must match ERE in EXPECTED column
#   du_s   — special: OUTFILE first field is byte size EXPECTED
#
# COMMAND runs from SD root via autoexec.txt (one command per emulator run).

cut_f2	cut -d, -f2 fixtures/cut_in.txt	out/cut_f2.txt	cut_f2.txt	file
cut_f13	cut -d, -f1,3 fixtures/cut_in.txt	out/cut_f13.txt	cut_f13.txt	file
uniq	uniq fixtures/uniq_in.txt	out/uniq.txt	uniq.txt	file
uniq_c	uniq -c fixtures/uniq_in.txt	out/uniq_c.txt	uniq_c.txt	file
uniq_d	uniq -d fixtures/uniq_in.txt	out/uniq_d.txt	uniq_d.txt	file
uniq_u	uniq -u fixtures/uniq_in.txt	out/uniq_u.txt	uniq_u.txt	file
tr_map	tr a-z A-Z fixtures/tr_in.txt	out/tr_map.txt	tr_map.txt	file
tr_del	tr -d o fixtures/tr_in.txt	out/tr_del.txt	tr_del.txt	file
tee_copy	tee out/tee_dest.txt fixtures/tee_in.txt	out/tee_stdout.txt	tee_copy.txt	file
tee_dest	tee out/tee_dest2.txt fixtures/tee_in.txt	out/tee_dest2.txt	tee_copy.txt	file
tee_append	tee -a out/tee_app.txt fixtures/tee_in.txt	out/tee_app.txt	tee_append_out.txt	file
diff_ab	diff fixtures/diff_a.txt fixtures/diff_b.txt	out/diff_ab.txt	diff_ab.txt	file
diff_same_q	diff -q fixtures/diff_a.txt fixtures/diff_a.txt	out/diff_same.txt	empty.txt	empty
touch_new	touch out/touched.txt	out/touched.txt	-	exists
du_s	du -s fixtures/du_tree	out/du_s.txt	7	du_s
df_fmt	df	out/df.txt	^/[ ]+[0-9]+	regex
